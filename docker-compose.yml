services:
  postgres:
    image: postgres:16-alpine
    container_name: aeo-nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeonexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeonexus_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aeo_nexus_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeonexus} -d ${POSTGRES_DB:-aeo_nexus_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aeo-nexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: aeo_nexus_postgres_data
  redis_data:
    name: aeo_nexus_redis_data

